<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>909CO — SHOP</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070707;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}button{font:inherit}a{color:inherit;text-decoration:none}.wrap{max-width:1450px;margin:auto;padding:0 28px}
header{height:78px;border-bottom:1px solid #252525;display:flex;align-items:center;position:sticky;top:0;background:rgba(7,7,7,.95);backdrop-filter:blur(10px);z-index:20}.headerInner{width:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-family:cursive;font-style:italic;font-weight:900;font-size:48px;line-height:1;letter-spacing:-5px;cursor:pointer}.nav{display:flex;gap:38px;font-size:13px;letter-spacing:2px}.nav a:first-child{text-decoration:underline;text-underline-offset:8px}.actions{display:flex;gap:16px;align-items:center;font-size:21px}.cartBtn{border:0;background:none;color:#fff;cursor:pointer}.count{font-size:12px;margin-left:-10px}
.shop{padding:42px 28px 70px}.sectionTitle{font-size:12px;letter-spacing:4px;color:#aaa;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.product{background:#151515;border:1px solid #242424;cursor:pointer;transition:.2s;min-width:0}.product:hover{transform:translateY(-3px);border-color:#555}.photo{height:330px;background:#151515;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.info{padding:15px 15px 18px;background:#151515}.name{font-size:14px;font-weight:700;letter-spacing:.8px}.price{font-size:14px;margin-top:6px;color:#ddd}
.detail{display:none;min-height:calc(100vh - 78px);padding:28px}.detail.open{display:block}.shop.hidden{display:none}.back{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid #444;color:#fff;padding:11px 16px;cursor:pointer;margin-bottom:22px}.detailBox{max-width:1320px;margin:auto;border:1px solid #292929;background:#0d0d0d;padding:22px;display:grid;grid-template-columns:1.55fr .8fr;gap:28px}.gallery{display:grid;grid-template-columns:88px 1fr;gap:14px;min-width:0}.thumbs{display:flex;flex-direction:column;gap:12px}.thumb{border:1px solid #333;background:#151515;padding:4px;cursor:pointer}.thumb.active{border-color:#eee}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.mainPhoto{background:#151515;min-height:560px;display:flex;align-items:center;justify-content:center}.mainPhoto img{max-width:100%;max-height:650px;width:100%;height:100%;object-fit:contain}.details{padding:15px 10px}.details h1{font-size:32px;margin:0 0 8px}.details .bigprice{font-size:23px;margin-bottom:28px}.label{font-size:12px;letter-spacing:2px;color:#aaa;margin-bottom:9px}.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.size{background:#0d0d0d;border:1px solid #555;color:#fff;padding:11px 15px;cursor:pointer;min-width:48px}.size.active{background:#fff;color:#000;border-color:#fff}.add{width:100%;padding:15px;background:#fff;color:#000;border:0;font-weight:800;letter-spacing:1px;cursor:pointer}.description{margin-top:28px;color:#c8c8c8;line-height:1.6;font-size:14px}.galleryHint{color:#888;font-size:11px;margin-top:8px}.cart{position:fixed;right:0;top:0;width:min(420px,92vw);height:100vh;background:#101010;border-left:1px solid #333;z-index:50;padding:24px;transform:translateX(100%);transition:.25s;overflow:auto}.cart.open{transform:translateX(0)}.cartHead{display:flex;justify-content:space-between;align-items:center}.cartHead button{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}.cartItem{display:flex;gap:12px;border-bottom:1px solid #292929;padding:14px 0}.cartItem img{width:72px;height:72px;object-fit:cover;background:#151515}.grow{flex:1}.muted{color:#888}.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{background:#181818;color:#fff;border:1px solid #444;padding:4px 9px;cursor:pointer}.total{display:flex;justify-content:space-between;border-top:1px solid #333;padding-top:16px;margin-top:14px;font-weight:800}.checkout{width:100%;margin-top:16px;padding:14px;background:#fff;color:#000;border:0;font-weight:800;cursor:pointer}
footer{border-top:1px solid #242424;padding:35px 28px 55px;color:#aaa;font-size:12px;display:flex;justify-content:space-between;gap:20px}.adminLink{display:none;font-size:10px;border:1px solid #444;padding:6px 8px;margin-left:10px;color:#fff}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:300px}.detailBox{grid-template-columns:1fr}.mainPhoto{min-height:420px}.nav{display:none}}
@media(max-width:560px){.wrap{padding:0 14px}.shop{padding:28px 14px 50px}.grid{gap:10px}.photo{height:220px}.info{padding:11px}.detail{padding:14px}.detailBox{padding:12px;gap:14px}.gallery{grid-template-columns:58px 1fr}.mainPhoto{min-height:330px}.details h1{font-size:25px}footer{padding:28px 14px;display:block}.actions{gap:10px}.logo{font-size:40px}}
</style>
</head>
<body>
<header><div class="headerInner wrap">
  <div id="ownerTrigger" class="logo" title="909">909</div>
  <nav class="nav"><a href="#shop">SHOP</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></nav>
  <div class="actions"><span>⌕</span><span>♙</span><button class="cartBtn" id="cartBtn">🛒</button><span class="count" id="count">0</span></div>
</div></header>

<main>
<section class="shop wrap" id="shop">
  <div class="sectionTitle">SHOP 909</div>
  <div class="grid" id="productGrid"></div>
</section>

<section class="detail" id="detail">
  <button class="back" id="backBtn">← BACK TO SHOP</button>
  <div class="detailBox">
    <div class="gallery"><div class="thumbs" id="thumbs"></div><div class="mainPhoto"><img id="mainPhoto" src="" alt=""></div></div>
    <div class="details"><h1 id="detailName"></h1><div class="bigprice" id="detailPrice"></div><div class="label" id="sizeLabel">SIZE</div><div class="sizes" id="detailSizes"></div><button class="add" id="detailAdd">ADD TO CART</button><div class="description" id="detailDescription"></div><div class="galleryHint" id="galleryHint"></div></div>
  </div>
</section>
<section class="wrap" id="about" style="padding:55px 28px"><div class="sectionTitle">909CO</div><p style="max-width:650px;color:#aaa;line-height:1.7">Built for people who move different. 909CO is a streetwear concept focused on clean graphics and a signature 909 mark.</p></section>
</main>

<div class="cart" id="cart"><div class="cartHead"><h3>YOUR CART</h3><button id="closeCart">×</button></div><div id="items"></div><div class="total"><span>SUBTOTAL</span><span id="total">$0.00</span></div><button class="checkout" onclick="alert('Checkout is not connected yet.')">CHECKOUT →</button></div>
<footer class="wrap" id="contact"><div><div style="display:flex;align-items:center"><div class="logo">909</div><a id="ownerAdminLink" class="adminLink" href="admin.html">OWNER ADMIN</a></div><div>© 2026 909CO</div></div><div>INSTAGRAM &nbsp; TIKTOK &nbsp; YOUTUBE</div></footer>

<script>
(function(){var id=window.GA_MEASUREMENT_ID;if(!id||id.indexOf('G-')!==0)return;var sc=document.createElement('script');sc.async=true;sc.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(id);document.head.appendChild(sc);})();
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());if(window.GA_MEASUREMENT_ID)gtag('config',window.GA_MEASUREMENT_ID);

const products=[
 {id:'tee',name:'909 TEE',price:20,images:['tee.jpg'],sizes:['S','M','L','XL','XXL'],desc:'Black 909 tee with the signature 909 mark on the front. Clean, heavyweight streetwear look.'},
 {id:'jeans',name:'909 JEANS',price:25,images:['jeans.jpg'],sizes:['28','30','32','34','36'],desc:'Black 909 jeans with a straight streetwear fit and a clean, understated finish.'},
 {id:'sheisty',name:'909 SHEISTY',price:12,images:['sheisty.jpg'],sizes:[],desc:'Black 909 sheisty with the 909 logo placed across the mouth opening.'},
 {id:'pink',name:'PINK',price:23,images:['pink-front.jpg','pink-back.jpg'],sizes:['S','M','L','XL','XXL'],desc:'Black tee with the pink 909 graphic. Front and back designs are shown in the product photos.'},
 {id:'white',name:'909 TEE — WHITE/BLACK',price:21,images:['white-front.jpg','white-back.jpg'],sizes:['S','M','L','XL','XXL'],desc:'Black tee with the white 909 graphic. Front and back designs are shown in the product photos.'}
];
let cart=JSON.parse(localStorage.getItem('909cart')||'[]');let current=null;
const $=s=>document.querySelector(s);
function money(n){return '$'+n.toFixed(2)}
function renderGrid(){const g=$('#productGrid');g.innerHTML=products.map(p=>`<article class="product" data-id="${p.id}"><div class="photo"><img src="${p.images[0]}" alt="${p.name}"></div><div class="info"><div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div></article>`).join('');g.querySelectorAll('.product').forEach(c=>c.addEventListener('click',()=>openProduct(c.dataset.id)))}
function openProduct(id){current=products.find(p=>p.id===id);if(!current)return;history.pushState({product:id},'',`#product-${id}`);$('#shop').classList.add('hidden');$('#about').style.display='none';$('#detail').classList.add('open');$('#detailName').textContent=current.name;$('#detailPrice').textContent=money(current.price);$('#detailDescription').textContent=current.desc;$('#sizeLabel').style.display=current.sizes.length?'block':'none';$('#detailSizes').innerHTML=current.sizes.map((s,i)=>`<button class="size${i===0?' active':''}" data-size="${s}">${s}</button>`).join('');$('#detailSizes').style.display=current.sizes.length?'flex':'none';$('#detailSizes').querySelectorAll('.size').forEach(b=>b.onclick=()=>{current.selectedSize=b.dataset.size;$('#detailSizes').querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#detailAdd').onclick=()=>addToCart(current,current.selectedSize||current.sizes[0]||'');$('#thumbs').innerHTML=current.images.map((img,i)=>`<button class="thumb${i===0?' active':''}" data-img="${img}"><img src="${img}" alt=""></button>`).join('');$('#thumbs').querySelectorAll('.thumb').forEach((b,i)=>b.onclick=()=>setMainImage(current.images[i],b));setMainImage(current.images[0],$('#thumbs .thumb'));$('#galleryHint').textContent=current.images.length>1?'Tap a photo to switch between front and back.':'';window.scrollTo(0,0)}
function setMainImage(src,btn){$('#mainPhoto').src=src;$('#thumbs .thumb')?.classList.remove('active');if(btn)btn.classList.add('active')}
function closeProduct(){history.pushState({},'',location.pathname);$('#detail').classList.remove('open');$('#shop').classList.remove('hidden');$('#about').style.display='block';current=null;window.scrollTo(0,0)}
$('#backBtn').onclick=closeProduct;window.addEventListener('popstate',()=>{if($('#detail').classList.contains('open')){history.replaceState({},'',location.pathname);closeProduct()}});
function save(){localStorage.setItem('909cart',JSON.stringify(cart));renderCart()}
function addToCart(p,size){let key=p.id+'|'+size,old=cart.find(x=>x.key===key);if(old)old.qty++;else cart.push({key,id:p.id,name:p.name+(size?' · '+size:''),price:p.price,img:p.images[0],qty:1});save();$('#cart').classList.add('open')}
function renderCart(){let n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.price*x.qty,0);$('#count').textContent=n;$('#total').textContent=money(t);$('#items').innerHTML=cart.map((x,i)=>`<div class="cartItem"><img src="${x.img}" alt=""><div class="grow"><b>${x.name}</b><div class="muted">${money(x.price)}</div><div class="qty"><button onclick="changeQty(${i},-1)">−</button>${x.qty}<button onclick="changeQty(${i},1)">+</button><button onclick="removeItem(${i})" style="margin-left:auto">×</button></div></div></div>`).join('')||'<div class="muted" style="padding:20px 0">Your cart is empty.</div>'}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save()}function removeItem(i){cart.splice(i,1);save()}
$('#cartBtn').onclick=()=>$('#cart').classList.toggle('open');$('#closeCart').onclick=()=>$('#cart').classList.remove('open');
let ownerTaps=0,ownerTimer=null;$('#ownerTrigger').addEventListener('click',e=>{ownerTaps++;clearTimeout(ownerTimer);ownerTimer=setTimeout(()=>ownerTaps=0,1600);if(ownerTaps>=5){ownerTaps=0;location.href='admin.html'}});
renderGrid();renderCart();
</script>
</body></html>
