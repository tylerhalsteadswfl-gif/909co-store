<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>909CO Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}main{max-width:1100px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px}.logo{font:italic 700 44px cursive}.muted{color:#888;font-size:12px}.panel{background:#0c0c0c;border:1px solid #292929;padding:20px;margin-top:18px}.login{max-width:430px;margin:70px auto}.input{width:100%;background:#111;border:1px solid #444;color:#fff;padding:13px;margin:7px 0}.btn{background:#fff;color:#000;border:0;padding:13px 18px;font-weight:800;cursor:pointer;margin-top:8px}.danger{background:#111;color:#fff;border:1px solid #444}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{border:1px solid #292929;background:#0b0b0b;padding:20px}.num{font-size:42px;font-weight:800;margin-top:7px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #292929;text-align:left;font-size:13px}.status{margin-top:10px;color:#aaa;font-size:12px}@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}
</style></head><body><main><div class="top"><div><div class="logo">909</div><div class="muted">OWNER ADMIN PANEL · PRIVATE</div></div><button id="logout" class="btn danger" style="display:none">LOG OUT</button></div><div id="app"></div><div style="margin-top:22px;text-align:center"><a href="index.html" class="muted">← BACK TO STORE</a></div></main><script>
const ready=typeof window.supabase!=='undefined'&&window.SUPABASE_URL&&!window.SUPABASE_URL.includes('PASTE_');
const sb=ready?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;
const app=document.querySelector('#app');
function setup(){app.innerHTML='<div class="panel login"><h2>ADMIN LOGIN</h2><div class="muted">Only your Supabase owner account should be used here.</div><input id="email" class="input" type="email" placeholder="Owner email"><input id="pass" class="input" type="password" placeholder="Password"><button id="login" class="btn">LOG IN</button><div id="msg" class="status"></div></div>';document.querySelector('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#pass').value});document.querySelector('#msg').textContent=error?error.message:'Logged in.';if(!error)load()}}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){setup();return}document.querySelector('#logout').style.display='block';document.querySelector('#logout').onclick=()=>sb.auth.signOut().then(load);app.innerHTML='<div class="panel"><div class="muted">SIGNED IN AS</div><b>'+session.user.email+'</b></div><div id="stats" class="stats" style="margin-top:18px"></div><div class="panel"><h2>RECENT VISITS</h2><div id="visits" class="muted">Loading…</div></div>';refresh()}
async function refresh(){
 const {data:vis,error}=await sb.from('site_visits').select('session_id,started_at,duration_seconds,last_seen_at').order('started_at',{ascending:false}).limit(500);
 if(error){document.querySelector('#stats').innerHTML='<div class="panel" style="grid-column:1/-1">'+error.message+'</div>';return}
 const rows=vis||[]; const unique=new Set(rows.map(x=>x.session_id)).size; const total=rows.length;
 const finished=rows.filter(x=>(x.duration_seconds||0)>0); const avg=finished.length?Math.round(finished.reduce((a,x)=>a+(x.duration_seconds||0),0)/finished.length):0;
 const current=rows.filter(x=>new Date(x.last_seen_at||x.started_at).getTime()>Date.now()-45000);
 document.querySelector('#stats').innerHTML='<div class="stat"><div class="muted">WEBSITE VIEWS</div><div class="num">'+total+'</div></div><div class="stat"><div class="muted">UNIQUE VISITORS</div><div class="num">'+unique+'</div></div><div class="stat"><div class="muted">AVERAGE TIME ON SITE</div><div class="num">'+formatTime(avg)+'</div></div>';
 document.querySelector('#visits').innerHTML=rows.length?'<table class="table"><tr><th>VISIT</th><th>STARTED</th><th>TIME</th></tr>'+rows.slice(0,100).map((x,i)=>'<tr><td>#'+(i+1)+'</td><td>'+new Date(x.started_at).toLocaleString()+'</td><td>'+formatTime(x.duration_seconds||0)+(current.includes(x)?' · <b>LIVE</b>':'')+'</td></tr>').join('')+'</table>':'No visits yet.';
}
function formatTime(sec){sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),s=sec%60;if(m<1)return s+'s';if(m<60)return m+'m '+s+'s';const h=Math.floor(m/60),mm=m%60;return h+'h '+mm+'m'}
if(!ready){app.innerHTML='<div class="panel login"><h2>BACKEND NOT CONNECTED</h2><p class="muted">Open config.js and add your Supabase project URL and publishable/anon key.</p></div>'}else load();
</script></body></html>
