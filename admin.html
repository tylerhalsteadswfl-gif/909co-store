<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>909CO Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}main{max-width:1100px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px}.logo{font:italic 700 44px cursive}.muted{color:#888;font-size:12px}.panel{background:#0c0c0c;border:1px solid #292929;padding:20px;margin-top:18px}.login{max-width:430px;margin:70px auto}.input{width:100%;background:#111;border:1px solid #444;color:#fff;padding:13px;margin:7px 0}.btn{background:#fff;color:#000;border:0;padding:13px 18px;font-weight:800;cursor:pointer;margin-top:8px}.danger{background:#111;color:#fff;border:1px solid #444}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{border:1px solid #292929;background:#0b0b0b;padding:20px}.num{font-size:42px;font-weight:800;margin-top:7px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #292929;text-align:left;font-size:13px}.status{margin-top:10px;color:#aaa;font-size:12px}@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}
</style></head><body><main><div class="top"><div><div class="logo">909</div><div class="muted">OWNER ADMIN PANEL · PRIVATE</div></div><button id="logout" class="btn danger" style="display:none">LOG OUT</button></div><div id="app"></div><div style="margin-top:22px;text-align:center"><a href="index.html" class="muted">← BACK TO STORE</a></div></main><script>
const ready=typeof window.supabase!=='undefined'&&window.SUPABASE_URL&&!window.SUPABASE_URL.includes('PASTE_');const sb=ready?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;const app=document.querySelector('#app');
function setup(){app.innerHTML='<div class="panel login"><h2>ADMIN LOGIN</h2><div class="muted">Only your Supabase owner account should be used here.</div><input id="email" class="input" type="email" placeholder="Owner email"><input id="pass" class="input" type="password" placeholder="Password"><button id="login" class="btn">LOG IN</button><div id="msg" class="status"></div></div>';document.querySelector('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});msg.textContent=error?error.message:'Logged in.';if(!error)load()}}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){setup();return}document.querySelector('#logout').style.display='block';document.querySelector('#logout').onclick=()=>sb.auth.signOut().then(load);app.innerHTML='<div class="panel"><div class="muted">SIGNED IN AS</div><b>'+session.user.email+'</b></div><div id="stats" class="stats" style="margin-top:18px"></div><div class="panel"><h2>CARTS RIGHT NOW</h2><div id="carts" class="muted">Loading…</div></div><div class="panel"><h2>PRODUCTS IN CARTS</h2><div id="products" class="muted">Loading…</div></div>';refresh()}
async function refresh(){const since=new Date(Date.now()-30*60*1000).toISOString();const [vis,carts]=await Promise.all([sb.from('site_visits').select('session_id',{count:'exact',head:false}),sb.from('cart_sessions').select('session_id,cart,updated_at').gte('updated_at',since)]);if(vis.error||carts.error){document.querySelector('#stats').innerHTML='<div class="panel" style="grid-column:1/-1">'+(vis.error?.message||carts.error?.message)+'</div>';return}const unique=new Set((vis.data||[]).map(x=>x.session_id)).size;const active=(carts.data||[]).filter(x=>Array.isArray(x.cart)&&x.cart.length).length;let qty=0;for(const r of carts.data||[])for(const x of r.cart||[])qty+=x.qty||0;document.querySelector('#stats').innerHTML='<div class="stat"><div class="muted">UNIQUE VISITORS</div><div class="num">'+unique+'</div></div><div class="stat"><div class="muted">PEOPLE WITH ITEMS IN CART</div><div class="num">'+active+'</div></div><div class="stat"><div class="muted">ITEMS IN ACTIVE CARTS</div><div class="num">'+qty+'</div></div>';document.querySelector('#carts').innerHTML=active?carts.data.filter(x=>x.cart?.length).map(x=>'<div style="border-top:1px solid #292929;padding:12px 0"><b>Visitor</b><div class="muted">'+new Date(x.updated_at).toLocaleString()+'</div>'+x.cart.map(i=>'<div>'+i.name+' × '+i.qty+' — $'+(i.price*i.qty).toFixed(2)+'</div>').join('')+'</div>').join(''):'No active carts right now.';const agg={};for(const r of carts.data||[])for(const i of r.cart||[]){agg[i.name]=(agg[i.name]||0)+(i.qty||0)}document.querySelector('#products').innerHTML=Object.keys(agg).length?'<table class="table"><tr><th>PRODUCT</th><th>QUANTITY</th></tr>'+Object.entries(agg).sort((a,b)=>b[1]-a[1]).map(([n,q])=>'<tr><td>'+n+'</td><td>'+q+'</td></tr>').join('')+'</table>':'No products in active carts.'}
if(!ready){app.innerHTML='<div class="panel login"><h2>BACKEND NOT CONNECTED</h2><p class="muted">Open config.js and add your Supabase project URL and anon key. The setup file in this folder has the exact database SQL and steps.</p></div>'}else load();
</script></body></html>
