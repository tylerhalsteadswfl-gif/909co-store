<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>909CO Admin</title>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}main{max-width:1000px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px}.logo{font:italic 700 44px cursive}.muted{color:#888;font-size:12px;letter-spacing:1px}.panel{background:#0c0c0c;border:1px solid #292929;padding:22px;margin-top:18px}.login{max-width:500px;margin:70px auto}.btn{background:#fff;color:#000;border:0;padding:14px 18px;font-weight:800;cursor:pointer;margin-top:10px}.danger{background:#111;color:#fff;border:1px solid #444}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{border:1px solid #292929;background:#0b0b0b;padding:24px}.num{font-size:44px;font-weight:800;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #292929;text-align:left;font-size:13px}.status{margin-top:12px;color:#aaa;font-size:12px;line-height:1.5}.link{color:#fff;text-decoration:underline}.error{color:#ff7777}.range{background:#111;color:#fff;border:1px solid #444;padding:10px}@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}
</style>
</head>
<body><main>
<div class="top"><div><div class="logo">909</div><div class="muted">OWNER ADMIN · GOOGLE ANALYTICS</div></div><button id="signout" class="btn danger" style="display:none">SIGN OUT</button></div>
<div id="app"></div>
<div style="margin-top:22px;text-align:center"><a href="index.html" class="muted">← BACK TO STORE</a></div>
</main>
<script>
const app=document.querySelector('#app');
let accessToken=null;
const configured=window.GA_PROPERTY_ID && !String(window.GA_PROPERTY_ID).includes('123456789') && window.GOOGLE_CLIENT_ID && !String(window.GOOGLE_CLIENT_ID).includes('YOUR_');
function fmt(sec){sec=Math.max(0,Math.round(Number(sec)||0));const m=Math.floor(sec/60),s=sec%60;if(m<60)return m+'m '+s+'s';const h=Math.floor(m/60),mm=m%60;return h+'h '+mm+'m'}
function setup(){app.innerHTML=`<div class="panel login"><h2>909 ADMIN</h2><p class="muted">Sign in with the Google account that has access to your 909CO Google Analytics property.</p><button id="google" class="btn">SIGN IN WITH GOOGLE</button><div id="msg" class="status"></div><p class="status">This admin no longer uses Supabase. Google Analytics supplies the website views and average session time.</p></div>`;document.querySelector('#google').onclick=login;}
function login(){if(!configured){document.querySelector('#msg').innerHTML='<span class="error">Add your GA property ID and Google OAuth client ID to config.js first.</span>';return} if(!window.google||!google.accounts){document.querySelector('#msg').textContent='Google sign-in is still loading. Try again in a moment.';return} const client=google.accounts.oauth2.initTokenClient({client_id:window.GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/analytics.readonly',callback:(resp)=>{if(resp.error){document.querySelector('#msg').innerHTML='<span class="error">Google sign-in failed: '+resp.error+'</span>';return}accessToken=resp.access_token;sessionStorage.setItem('ga_access_token',accessToken);loadDashboard();}});client.requestAccessToken({prompt:'consent'});}
async function report(dateRange){const url=`https://analyticsdata.googleapis.com/v1beta/properties/${encodeURIComponent(window.GA_PROPERTY_ID)}:runReport`;const body={dateRanges:[dateRange],metrics:[{name:'screenPageViews'},{name:'averageSessionDuration'}]};const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||'Google Analytics request failed.');return data;}
async function daily(){const url=`https://analyticsdata.googleapis.com/v1beta/properties/${encodeURIComponent(window.GA_PROPERTY_ID)}:runReport`;const body={dateRanges:[{startDate:'28daysAgo',endDate:'today'}],dimensions:[{name:'date'}],metrics:[{name:'screenPageViews'},{name:'averageSessionDuration'}],limit:31};const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||'Google Analytics request failed.');return data;}
async function loadDashboard(){document.querySelector('#signout').style.display='block';document.querySelector('#signout').onclick=()=>{accessToken=null;sessionStorage.removeItem('ga_access_token');location.reload()};app.innerHTML=`<div class="panel"><div class="row"><div><div class="muted">GOOGLE ANALYTICS</div><h2 style="margin:6px 0">909CO TRAFFIC</h2></div><select id="range" class="range"><option value="7daysAgo">LAST 7 DAYS</option><option value="28daysAgo" selected>LAST 28 DAYS</option><option value="90daysAgo">LAST 90 DAYS</option></select></div><div id="msg" class="status">Loading…</div></div><div id="stats" class="stats" style="margin-top:18px"></div><div class="panel"><div class="row"><h2>DAILY TRAFFIC</h2><a class="link" target="_blank" href="https://analytics.google.com/">OPEN GOOGLE ANALYTICS</a></div><div id="daily" class="muted">Loading…</div></div>`;await refresh();document.querySelector('#range').onchange=refresh;}
async function refresh(){const msg=document.querySelector('#msg');try{msg.textContent='Updating…';const start=document.querySelector('#range')?.value||'28daysAgo';const data=await report({startDate:start,endDate:'today'});const vals=data.rows?.[0]?.metricValues||[];const views=Number(vals[0]?.value||0);const avg=Number(vals[1]?.value||0);document.querySelector('#stats').innerHTML=`<div class="stat"><div class="muted">WEBSITE VIEWS</div><div class="num">${views.toLocaleString()}</div></div><div class="stat"><div class="muted">AVERAGE TIME STAYED</div><div class="num">${fmt(avg)}</div></div>`;const d=await daily();const rows=d.rows||[];document.querySelector('#daily').innerHTML=rows.length?'<table class="table"><tr><th>DATE</th><th>VIEWS</th><th>AVG TIME</th></tr>'+rows.reverse().map(x=>{const v=x.metricValues||[];const date=x.dimensionValues?.[0]?.value||'';return `<tr><td>${date}</td><td>${Number(v[0]?.value||0).toLocaleString()}</td><td>${fmt(v[1]?.value||0)}</td></tr>`}).join('')+'</table>':'No data yet.';msg.textContent='Data comes directly from Google Analytics 4.';}catch(e){msg.innerHTML='<span class="error">'+e.message+'</span><br><span class="muted">Make sure the Google account you signed in with has at least Viewer access to the GA4 property and that the Google Analytics Data API is enabled.</span>';}}
if(!configured){app.innerHTML='<div class="panel login"><h2>GOOGLE ANALYTICS NOT CONNECTED</h2><p class="muted">Open config.js and add your GA Measurement ID, GA Property ID, and Google OAuth Web Client ID.</p></div>';}else{const saved=sessionStorage.getItem('ga_access_token');if(saved){accessToken=saved;loadDashboard();}else setup();}
</script></body></html>
